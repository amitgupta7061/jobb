name: Manual Job Radar Sync

on:
  workflow_dispatch:
    # Manual trigger only - no automatic schedules

jobs:
  collect-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Job Radar Sync Endpoint
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          COLLECTION_SECRET: ${{ secrets.COLLECTION_SECRET }}
        run: |
          echo "Triggering manual Job Radar collection pipeline..."
          curl -X POST "${APP_URL}/api/collect" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${COLLECTION_SECRET}" \
            --fail --silent --show-error
